# Tests and packages the ASCII Ripples VS Code extension. The .vsix is attached to
# the run as the "ascii-ripples-vsix" artifact; pushing an `ascii-ripples-<version>`
# tag also publishes it as a GitHub release. (Not `v*`: that cuts an app release.)
name: VS Code extension

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["ascii-ripples-*"]
    # Not evaluated for tag pushes.
    paths:
      - Integrations/vscode-ascii-ripples/**
      - .github/workflows/vscode-extension.yml
  pull_request:
    paths:
      - Integrations/vscode-ascii-ripples/**
      - .github/workflows/vscode-extension.yml

permissions:
  contents: read

jobs:
  vsix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Integrations/vscode-ascii-ripples
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Package
        run: |
          cp ../../LICENSE LICENSE
          npx --yes @vscode/vsce@3 package --out .

      - uses: actions/upload-artifact@v4
        with:
          name: ascii-ripples-vsix
          path: Integrations/vscode-ascii-ripples/*.vsix
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/ascii-ripples-')
    needs: vsix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ascii-ripples-vsix

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" *.vsix --repo "$GITHUB_REPOSITORY" \
            --title "ASCII Ripples for VS Code ${TAG#ascii-ripples-}" \
            --notes "VS Code extension: the ASCII Ripples wallpaper behind empty editors. Install: Extensions → … → Install from VSIX. / Расширение VS Code: обои ASCII Ripples за пустым редактором. Установка: Extensions → … → Install from VSIX."
